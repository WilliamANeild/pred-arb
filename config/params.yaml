# Strategy parameters. Freeze these BEFORE any reported backtest window so results
# aren't the product of hindsight tuning. Every value here can also be overridden
# per-run. Risk caps live in .env (see SafetyConfig); this file is pure strategy.

# --- consensus / signal ---
min_consensus: 0.15          # medium-market band: ignore <15% and >85% (tail risk)
max_consensus: 0.85
deviation_threshold: 0.05    # relative-value: min |member - consensus| to act
close_deviation: 0.01        # exit a convergence trade once it narrows to this
dispersion_min: 0.03         # group must be at least this dispersed to be interesting
weight_by_liquidity: true    # consensus = liquidity-weighted mean (else simple mean)

# --- quality filters ---
min_depth_contracts: 10      # tradeable level must show at least this many contracts
max_spread: 0.10             # skip wider books (prob units)
phantom_haircut: 0.5         # assume only this fraction of shown depth is real

# --- fees ---
kalshi_fee_rate: 0.07        # Kalshi taker fee coefficient: ceil(rate*n*p*(1-p))
polymarket_fee_rate: 0.0     # Polymarket has no per-trade taker fee (as of 2026)

# --- riskless (dutch-book) ---
riskless_min_edge: 0.01      # min guaranteed edge (prob units) for a lock to fire

# --- relative-value ---
relval_min_edge: 0.04        # min fee-adjusted expected edge to open a convergence trade

# --- sizing ---
kelly_fraction: 0.20         # fractional Kelly ceiling
confidence_floor: 0.10       # below this confidence, size = 0
cluster_trust: 0.60          # trust weight applied to NLP-cluster groups (dampens size)
